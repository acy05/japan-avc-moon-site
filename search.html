<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102b40"><title>製品検索 — 日本AVC</title><meta name="description" content="日本AVCのケーブルグランド・チューブ・周辺パーツを品番と接続条件から探す。"><link rel="stylesheet" href="brand-catalog.css"><script type="module" src="search.js"></script></head><body class="catalog-page"><a class="skip-link" href="#main">本文へ進む</a><div id="site-header"></div><main id="main" class="catalog-main"><nav class="breadcrumbs" aria-label="パンくず"><a href="index.html">TOP</a><span>／</span><a href="find.html">FIND</a><span>／</span><span aria-current="page">製品検索</span></nav><div class="catalog-hero"><div><p class="eyebrow">PRODUCT SEARCH</p><h1>条件から、つながりを探す。</h1><p>品番・材質・接続ねじ・電線径。必要な条件で絞り込めます。</p></div><a class="quiet-btn" href="find.html">探し方を選び直す </a></div><div class="search-layout"><form id="filters" class="filter-panel" role="search"><h2>製品を探す</h2><label class="wide" for="q">品番・キーワード</label><div class="keyword-search"><input id="q" name="q" type="search" placeholder="FGA13、耐熱…" autocomplete="off"><button class="primary-btn" type="submit" aria-label="品番・キーワードを検索">検索</button></div><details id="filter-options" class="facet-disclosure" open><summary>条件で絞り込む <span id="filter-count"></span><span aria-hidden="true">＋</span></summary><div class="filter-fields"><label for="category">カテゴリ<select id="category" name="category"><option value="">すべて</option></select></label><label for="material">材質区分<select id="material" name="material"><option value="">すべて</option><option value="nylon">ナイロン</option><option value="brass">真鍮</option><option value="stainless">ステンレス</option><option value="other">その他</option></select></label><label for="thread">接続ねじ<select id="thread" name="thread"><option value="">すべて</option><option value="M">M（メートル）</option><option value="G">G / PF</option><option value="PG">PG</option><option value="NPT">NPT</option></select></label><label for="diameter">電線仕上外径 (mm)<input id="diameter" name="diameter" type="number" min="0.1" step="0.1" placeholder="例：5.0"></label><p class="field-hint">適用電線径が明示された製品のみ対象。チューブ径は含みません。</p><label class="wide" for="feature">シリーズの特徴<select id="feature" name="feature"><option value="">指定しない</option><option>単穴</option><option>多芯</option><option>耐熱</option><option>EMC</option><option>フレキ</option><option>防水</option></select></label><button class="primary-btn" type="submit">この条件で探す </button><button id="reset-filters" class="quiet-btn" type="button">条件をクリア</button></div></details></form><section id="search-results" aria-label="検索結果"><div class="results-toolbar"><h2 id="result-count" tabindex="-1" role="status" aria-live="polite"></h2><label>並び順<select id="sort"><option value="part">品番順</option><option value="diameter">適用電線径が小さい順</option></select></label></div><div id="active-filters" class="active-filters" aria-label="適用中の条件"></div><p class="results-hint">気になる製品を「比較に追加」して、仕様の違いを確かめられます。</p><div id="products" class="product-grid"></div><div id="empty" class="empty-state" hidden><h2>条件に合う製品が見つかりませんでした。</h2><p>品番の一部で探すか、条件をひとつ外してみてください。</p><button class="quiet-btn" id="empty-reset">条件をクリア</button><a class="primary-btn" href="https://www.ip68.jp/contacts/index.html" target="_blank" rel="noopener">条件を相談する </a></div><nav class="pagination" aria-label="検索結果のページ"><button id="prev" class="quiet-btn"> 前へ</button><span id="page-count"></span><button id="next" class="quiet-btn">次へ </button></nav><p id="coverage-note" class="source-note"></p></section></div><noscript><p>この製品検索はJavaScriptを使用します。<a href="https://www.ip68.jp/products/index.html">公式製品一覧をご覧ください。</a></p></noscript></main><div id="site-footer"></div></body></html>
